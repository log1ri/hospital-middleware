services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: staff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hospital
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staff -d hospital"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
